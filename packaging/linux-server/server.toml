# PeerDesk 服务端配置（公网单机部署）。未知字段会报错。
# 改完后执行：sudo systemctl restart peerdesk-server
# 安装脚本只在这个文件不存在时才写入，升级不会覆盖你的修改。

# 节点标识：集群内唯一，不能为 0。单机部署不用改。
node_id = 1
# 本节点所在区域名，随便起，单机部署不影响使用。
region = "default"

# 管理页面与接口。只绑定本机；要从外面看，请用 SSH 隧道：
#   ssh -L 8080:127.0.0.1:8080 用户@服务器
# 然后在本地浏览器打开 http://127.0.0.1:8080 。不要直接暴露到公网。
http_listen = "127.0.0.1:8080"

# 集群心跳。单机部署只在本机监听，不需要对外开放。
cluster_listen = "127.0.0.1:7946"
advertise = "127.0.0.1:7946"

# 信令（UDP，QUIC）：两台电脑在这里登记和互相找到对方，并协助打洞。
# 防火墙和云安全组要放行 UDP 4433。
signal_listen = "0.0.0.0:4433"

# 服务器身份（证书和私钥）保存的目录，由 systemd 的 StateDirectory 管理。
# 不要删除：删除后服务器指纹会变，所有客户端都要重新填指纹。
data_dir = "/var/lib/peerdesk"

# 中继（UDP）：两台电脑直连不通时，数据经服务器转发。会占用服务器的带宽。
# 防火墙和云安全组要放行 UDP 3478。
relay_listen = "0.0.0.0:3478"
# 告诉客户端的中继地址，必须是服务器的公网 IP 和中继端口。
# install.sh 会自动填入；手工部署时请自己改成真实地址。
# 不能省略：省略时客户端会收到 0.0.0.0，中继用不了。
relay_advertise = "__PUBLIC_IP__:3478"

[crypto]
# 预设三选一：recommended（默认）、fips、none。
preset = "recommended"
