# PeerDesk 服务端配置示例。未知字段会报错。

# 节点标识：集群内唯一，不能为 0。
node_id = 1
# 本节点所在区域。同区域的客户端优先连到这里。
region = "us-east"

# 管理页面与接口。只应暴露给运维网络。
http_listen = "127.0.0.1:8080"
# 集群心跳（UDP）。
cluster_listen = "0.0.0.0:7946"
# 其他节点用来联系本节点的地址。
advertise = "10.0.0.1:7946"
# 启动时已知的其他节点。只要认识一个，就能通过心跳发现全体。
peers = ["10.0.0.2:7946"]

# 集群共享密钥：所有节点相同，至少 16 个字符。设置后心跳带认证。
# 不设置时任何能访问集群端口的机器都能伪造节点，只能用于受信任的内网。
cluster_secret = "change-me-to-a-long-random-string"

# 本区域节点全部过载或不可用时，客户端依次溢出到这些区域。
region_fallback = ["us-west", "eu-west"]

# 信令（UDP，QUIC）：被控端在这里登记，控制端用设备指纹找到它。不写时不提供信令。
signal_listen = "0.0.0.0:4433"
# 保存服务器身份（证书和私钥）的目录，开启信令时必须设置。
# 启动时会打印服务器指纹，客户端用 --server-pin 核对。
data_dir = "/var/lib/peerdesk-server"
# 中继（UDP）：直连不通时转发数据并计量。需要同时开启信令；不写时不提供中继。
relay_listen = "0.0.0.0:3478"
# 告诉客户端的中继地址。服务器在 NAT 或负载均衡后面时填公网地址；不写时用实际监听地址。
relay_advertise = "203.0.113.10:3478"

[crypto]
# 预设三选一：recommended（默认）、fips、none。
preset = "recommended"
# 或者自定义列表（与 preset 二选一），按偏好排列：
# suites = ["aes-256-gcm", "chacha20-poly1305", "aes-128-gcm"]
