[package]
name = "peerdesk-net"
description = "PeerDesk 网络层：基于 QUIC 的真实传输"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# 画面编解码（会话的被控端和控制端）。服务端只做信令和中继，不需要它，也就不用编译 C++ 的 openh264，
# 可以静态链接 musl 发布。
default = ["media", "portmap"]
media = ["dep:peerdesk-media"]
# 请家里的路由器为本机映射端口（UPnP、NAT-PMP、PCP）。
portmap = ["dep:igd-next"]

[dependencies]
log = "0.4"
peerdesk-core.workspace = true
peerdesk-media = { workspace = true, optional = true }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
# 自己实现 QUIC 的拥塞控制接口要用到它的往返时间类型（quinn 没有转出），版本跟 quinn 一致
quinn-proto = { version = "0.11", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
ring = "0.17"
bytes = "1"
if-addrs = "0.15"
socket2 = "0.6"
# 只有客户端要请路由器映射端口（UPnP 要 HTTP 客户端，依赖较多），服务端不编译它。
igd-next = { version = "0.18", default-features = false, features = ["aio_tokio"], optional = true }

[lints]
workspace = true

[dev-dependencies]
# 粘贴键等待的超时（10 秒）用暂停的时钟测，不真的等
tokio = { version = "1", features = ["test-util"] }
