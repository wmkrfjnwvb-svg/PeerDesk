[workspace]
resolver = "2"
members = ["crates/core", "crates/media", "crates/e2e", "crates/net", "crates/platform", "crates/client", "crates/server", "crates/mobile"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.89"
repository = "https://github.com/peerdesk/peerdesk"

[workspace.dependencies]
peerdesk-core = { path = "crates/core" }
peerdesk-net = { path = "crates/net", default-features = false }
# 默认不带软件 H.264（OpenH264）：桌面的成员在自己的 Cargo.toml 里打开 `source`，手机端不带（见 docs/research/R-android.md）。
peerdesk-media = { path = "crates/media", default-features = false }
peerdesk-platform = { path = "crates/platform" }

# 编译期检查：所有 crate 通过 `[lints] workspace = true` 继承。
[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_patterns = "deny"
unused_must_use = "deny"
unused_results = "allow"
missing_debug_implementations = "deny"
trivial_casts = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
# match 必须逐个列出枚举成员：新增成员时所有 match 都会编译失败，强制处理。
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
# 非测试代码不允许可能 panic 的写法：处理的是不可信的网络输入。
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"

# 开发和测试构建里，依赖库（OpenH264、图形界面等）也开优化：不优化的软件编码器编一帧要好几秒，
# 会让会话测试超时。只影响依赖，我们自己的代码仍按调试方式编译（覆盖率只统计我们的代码）。
[profile.dev.package."*"]
opt-level = 2

# 媒体模块是纯计算（颜色转换、像素打包），不优化时 720p 一帧要几十毫秒，会话测试会被它拖垮。
[profile.dev.package.peerdesk-media]
opt-level = 2

# 体积优先的发布配置。
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
