name: CI
# 省着用：每次推送只在 Linux 上跑 lint、覆盖率门槛（含全部测试）和端到端测试。
# Windows / macOS 的测试、平台实机测试、界面截图、安装包按需触发：
# - 提交信息里写 [mac] 或 [win]：只跑那个平台的测试和实机测试；[full]：全部平台加界面截图；
#   [pkg]：打安装包（同时验证 Docker 镜像能构建）；[load]：服务端并发压力测试（Linux）。
#   可以组合，例如 [mac][pkg]。先在一个平台上验证，过了再跑其他平台；
# - 在 Actions 页面手动运行（Run workflow），选择范围：full / macos-tests / windows-tests / packages。
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: 跑哪些平台任务
        type: choice
        options: [full, macos-tests, windows-tests, packages]
        default: full

# 同一个分支上有新的推送时，取消还在跑的旧任务。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: lint + coverage gate (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 版本由 rust-toolchain.toml 固定。
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # 声卡（cpal）在 Linux 上要 ALSA 的开发库
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build console
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: web
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests with coverage gate (99% lines)
        run: ./scripts/coverage.sh --show-missing-lines

  # Windows / macOS 跑全部测试和发布构建的冒烟测试（Linux 的测试已经在覆盖率任务里跑过）。按需触发。
  platforms:
    name: test + release (${{ matrix.os }})
    # 有测试卡住时不要拖到默认的 6 小时
    timeout-minutes: 75
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.scope != 'packages') || contains(github.event.head_commit.message, '[full]') || contains(github.event.head_commit.message, '[mac]') || contains(github.event.head_commit.message, '[win]') }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.scope == 'macos-tests' && '["macos-latest"]' || inputs.scope == 'windows-tests' && '["windows-latest"]' || (!contains(github.event.head_commit.message, '[full]') && contains(github.event.head_commit.message, '[mac]') && !contains(github.event.head_commit.message, '[win]')) && '["macos-latest"]' || (!contains(github.event.head_commit.message, '[full]') && contains(github.event.head_commit.message, '[win]') && !contains(github.event.head_commit.message, '[mac]')) && '["windows-latest"]' || '["windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # 一个测试程序失败也接着跑完其他的：一次运行看到所有平台问题，不用反复重跑。
      - run: cargo test --workspace --no-fail-fast
      - run: cargo build --release -p peerdesk -p peerdesk-server
      - name: Smoke test the binaries
        shell: bash
        run: |
          ./target/release/peerdesk version
          ./target/release/peerdesk probe
          ./target/release/peerdesk sim --link wifi --frames 60
          ./target/release/peerdesk bench-transport --packets 600

  # 端到端测试：真实编码器 + 仿真网络 + 接近真实的桌面画面。每次都跑，
  # 截图和指标作为构建产物上传，表格贴到运行摘要里。
  e2e:
    name: e2e (simulated network, real codec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # 声卡（cpal）在 Linux 上要 ALSA 的开发库
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev
      - name: Run scenarios
        run: cargo test --release -p peerdesk-e2e -- --nocapture --test-threads 2
      # 真实二进制的闭环：虚拟桌面上真采集、真注入，经回环网络和加了延迟丢包的网络各跑一次。
      - name: Live loop (real binaries, X11, netem)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xterm
          cargo build --release -p peerdesk
          ./scripts/e2e-live.sh
      # 打洞：网络命名空间 + nftables 搭出各种 NAT 组合，真实二进制按设备码连接。
      # 门槛：除了两端都是对称型（应当马上走中继），其余组合都必须直连。
      - name: NAT lab (hole punching, real binaries)
        if: always()
        run: |
          sudo apt-get install -y -qq nftables iproute2
          sudo modprobe sch_netem 2>/dev/null || true
          cargo build --release -p peerdesk -p peerdesk-server
          sudo ./scripts/nat-lab.sh target/release 3
      - name: Summary
        if: always()
        run: |
          {
            echo "## 端到端测试"
            echo
            echo "### 门槛"
            echo
            echo "| 场景 | 编码 | 门槛 | 结果 | 说明 |"
            echo "|---|---|---|---|---|"
            cat target/e2e/gates.md 2>/dev/null || true
            echo
            echo "### 各阶段指标"
            echo
            first=1
            for f in target/e2e/*/result.md; do
              if [ $first = 1 ]; then cat "$f"; first=0; else tail -n +3 "$f"; fi
            done
            echo
            echo "### 真实二进制闭环（采集 → 编码 → 传输 → 解码 → 显示，输入 → 被控端执行）"
            echo
            cat target/e2e-live/summary.md 2>/dev/null || echo "没有运行"
            echo
            echo "#### 实验：画面大量变化时 QUIC 层拥塞控制的影响（只报告）"
            echo
            cat target/e2e-live/congestion.md 2>/dev/null || true
            echo
            echo "### 打洞（NAT 仿真，真实二进制）"
            echo
            cat target/nat-lab/summary.md 2>/dev/null || echo "没有运行"
            echo
            echo "截图在构建产物 e2e-<提交>：每个场景一个目录，左边源画面、中间控制端看到的画面、右边差异（放大 8 倍）。"
          } >> "$GITHUB_STEP_SUMMARY"
      # 截图几十 MB：只在失败或完整运行时上传。
      - uses: actions/upload-artifact@v4
        if: ${{ failure() || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full') || contains(github.event.head_commit.message, '[full]') }}
        with:
          name: e2e-${{ github.sha }}
          path: |
            target/e2e
            target/e2e-live
            target/nat-lab
          retention-days: 3

  # 平台层实机测试：在三个系统的桌面上真的采集画面、注入键鼠（crates/platform/tests/live.rs），
  # 再用发布版跑一次 screen-check 量采集耗时、保存画面。
  # Linux 用 Xvfb；Windows 用 CI 机器的交互桌面；macOS 的 CI 机器可能没有“屏幕录制”权限，
  # 这时测试打印说明后跳过，screen-check 报告缺少权限但不算失败（能不能采集本身就是要知道的信息）。
  platform-live:
    name: platform live (${{ matrix.os }})
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.scope != 'packages') || contains(github.event.head_commit.message, '[full]') || contains(github.event.head_commit.message, '[mac]') || contains(github.event.head_commit.message, '[win]') }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.scope == 'macos-tests' && '["macos-latest"]' || inputs.scope == 'windows-tests' && '["windows-latest"]' || (!contains(github.event.head_commit.message, '[full]') && contains(github.event.head_commit.message, '[mac]') && !contains(github.event.head_commit.message, '[win]')) && '["macos-latest"]' || (!contains(github.event.head_commit.message, '[full]') && contains(github.event.head_commit.message, '[win]') && !contains(github.event.head_commit.message, '[mac]')) && '["windows-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Start a virtual X11 display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xterm libasound2-dev
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 2
      - name: Live tests
        run: cargo test -p peerdesk-platform --test live -- --ignored --test-threads 1 --nocapture
      - name: screen-check (release build)
        shell: bash
        run: |
          cargo build --release -p peerdesk
          set +e
          ./target/release/peerdesk screen-check --out screen.bmp | tee check.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ] && [ "$RUNNER_OS" = "macOS" ] && grep -q "权限" check.txt; then
            echo "::notice title=macOS 没有屏幕录制权限::这台 CI 机器没有授予屏幕录制权限，无法采集画面（不算失败）"
            exit 0
          fi
          exit "$code"
      # 无人值守：真的注册系统服务，看服务是否在控制台会话里拉起代理、代理是否开始监听，再卸载。
      # 代理的服务器指向本机一个没人的端口（CI 不去登记真服务器）。
      - name: unattended service (install → agent listening → uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = (Resolve-Path target\release\peerdesk.exe).Path
          $base = Join-Path $env:ProgramData 'PeerDesk'
          New-Item -ItemType Directory -Force (Join-Path $base 'agent') | Out-Null
          Set-Content -Path (Join-Path $base 'agent\server.txt') -Value "127.0.0.1:9"
          & $exe service password ci-unattended-pw | Out-Host
          & $exe service install | Out-Host
          sc.exe query PeerDesk | Out-Host
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep 1
            $st = Join-Path $base 'status.txt'
            if ((Test-Path $st) -and ((Get-Content $st -TotalCount 1) -eq '1')) { $ok = $true; break }
          }
          Write-Host "活动控制台会话：$((Get-CimInstance Win32_ComputerSystem).UserName)"
          & $exe service status | Out-Host
          Get-Process peerdesk -ErrorAction SilentlyContinue | Select-Object Id, SessionId, StartTime | Out-Host
          Get-ChildItem (Join-Path $base 'logs') -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 40 } | Out-Host
          & $exe service uninstall | Out-Host
          if (-not $ok) { Write-Error "代理没有开始监听（见上面的状态和日志）"; exit 1 }
          if (Get-Process peerdesk -ErrorAction SilentlyContinue) { Start-Sleep 3 }
          if (Get-Process peerdesk -ErrorAction SilentlyContinue) { Write-Error "卸载后代理还在运行"; exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-check-${{ matrix.os }}
          path: screen.bmp
          if-no-files-found: ignore

  # 每次推送都打一个能下载、安装、在自己机器之间试用的测试包。
  package:
    name: package (${{ matrix.name }})
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.scope == 'packages' || inputs.scope == 'full')) || contains(github.event.head_commit.message, '[pkg]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            script: scripts/package-windows.sh
          - os: macos-latest
            name: macos-universal
            script: scripts/package-macos.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: package
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build console
        shell: bash
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: web
      - name: Package
        shell: bash
        run: |
          short=$(git rev-parse --short=7 HEAD)
          echo "ARTIFACT=peerdesk-$short-${{ matrix.name }}" >> "$GITHUB_ENV"
          ${{ matrix.script }} dist "peerdesk-$short-${{ matrix.name }}"
      - name: Binary sizes
        shell: bash
        run: ls -l target/release/peerdesk* target/universal/* 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # Linux 服务端安装包：musl 静态链接（服务端不含视频编解码，只需 musl-gcc），带 systemd 单元和安装脚本。
  # 和 package 同样只在 [pkg] 时跑。
  package-server-linux:
    name: package (linux-server)
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.scope == 'packages' || inputs.scope == 'full')) || contains(github.event.head_commit.message, '[pkg]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: rustup target add x86_64-unknown-linux-musl
      - run: sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: package-server-linux
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build console
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: web
      - name: Package
        run: |
          echo "SHORT=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          scripts/package-server-linux.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: peerdesk-${{ env.SHORT }}-linux-server
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # Linux 客户端：在 22.04 上构建，较老的发行版（glibc 2.35）也能运行。和 package 同样只在 [pkg] 时跑。
  package-linux:
    name: package (linux-x64)
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.scope == 'packages' || inputs.scope == 'full')) || contains(github.event.head_commit.message, '[pkg]') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: package-linux
      - name: Package
        run: |
          echo "SHORT=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          scripts/package-linux.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: peerdesk-${{ env.SHORT }}-linux-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # Docker 镜像：只验证能构建（不推送）。和打包一样只在 [pkg] 时跑。
  docker-build:
    name: docker build (server)
    if: ${{ contains(github.event.head_commit.message, '[pkg]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/docker/Dockerfile -t peerdesk-server:ci .
      # 能启动并读到配置：镜像里的默认配置只开信令，--exit-after-ms 让它自己退出。
      - name: Smoke run
        run: docker run --rm peerdesk-server:ci /etc/peerdesk/server.toml --exit-after-ms 1500

  # 服务端并发压力测试（登记、同时连接、中继吞吐）：三个真实节点跑在本进程里。
  # 只在提交信息带 [load] 时跑；摘要写进 Actions 页面，只在失败时上传文件。
  load:
    name: load (server concurrency)
    if: ${{ contains(github.event.head_commit.message, '[load]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: load
      - name: Load test
        run: cargo test --release -p peerdesk-server --test load -- --ignored --nocapture
        env:
          PEERDESK_LOAD_DEVICES: 200
          PEERDESK_LOAD_SESSIONS: 50
          PEERDESK_LOAD_SECONDS: 10
      - name: Summary
        if: always()
        run: |
          if [ -f target/load/summary.md ]; then cat target/load/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: peerdesk-${{ github.sha }}-load-summary
          path: target/load/summary.md
          if-no-files-found: ignore
          retention-days: 7

  # 在虚拟显示器上打开图形界面（自测模式：开启被控并连接本机），截一张图。
  gui-screenshot:
    name: gui screenshot (linux)
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.scope == 'full') || contains(github.event.head_commit.message, '[full]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb imagemagick libgl1-mesa-dri libegl1 libxkbcommon-x11-0 fonts-noto-cjk libasound2-dev
      - run: cargo build --release -p peerdesk
      - name: Run the GUI and take screenshots
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          export DISPLAY=:99 PEERDESK_DATA_DIR=$PWD/gui-data
          # 主窗口（只开启被控）两种语言各一张，观看窗口（连接本机）一张。
          shot() {
            PEERDESK_LANG=$1 PEERDESK_GUI_SELFTEST=$2 ./target/release/peerdesk > gui-$3.log 2>&1 &
            pid=$!
            sleep 10
            import -window root gui-$3.png
            kill $pid || true
            wait $pid || true
            cat gui-$3.log
          }
          shot zh host main-zh
          shot en host main-en
          shot zh connect viewer-zh
          # macOS 授权引导（在 Linux 上预览 macOS 15）和设置页
          PEERDESK_GUI_PAGE=permissions PEERDESK_GUI_PREVIEW_MAC=15 shot zh host guide-zh
          PEERDESK_GUI_PAGE=settings shot en host settings-en
          ls -l gui-*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: peerdesk-gui-screenshots
          path: gui-*.png
          retention-days: 14
