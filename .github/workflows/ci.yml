name: CI
on:
  push:
  pull_request:

# 同一个分支上有新的推送时，取消还在跑的旧任务。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: lint + coverage gate (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 版本由 rust-toolchain.toml 固定。
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build console
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: web
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests with coverage gate (99% lines)
        run: ./scripts/coverage.sh --show-missing-lines

  # 三个系统并行跑全部测试，并产出发布二进制。
  platforms:
    name: test + release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release -p peerdesk -p peerdesk-server
      - name: Smoke test the binaries
        shell: bash
        run: |
          ./target/release/peerdesk version
          ./target/release/peerdesk probe
          ./target/release/peerdesk sim --link wifi --frames 60
          ./target/release/peerdesk bench-transport --packets 600
      - uses: actions/upload-artifact@v4
        with:
          name: peerdesk-${{ matrix.os }}
          path: |
            target/release/peerdesk
            target/release/peerdesk.exe
            target/release/peerdesk-server
            target/release/peerdesk-server.exe
          if-no-files-found: ignore

  # 端到端测试：真实编码器 + 仿真网络 + 接近真实的桌面画面。每次都跑，
  # 截图和指标作为构建产物上传，表格贴到运行摘要里。
  e2e:
    name: e2e (simulated network, real codec)
    runs-on: ubuntu-latest
  # 平台层实机测试：在三个系统的桌面上真的采集画面、注入键鼠（crates/platform/tests/live.rs），
  # 再用发布版跑一次 screen-check 量采集耗时、保存画面。
  # Linux 用 Xvfb；Windows 用 CI 机器的交互桌面；macOS 的 CI 机器可能没有“屏幕录制”权限，
  # 这时测试打印说明后跳过，screen-check 报告缺少权限但不算失败（能不能采集本身就是要知道的信息）。
  platform-live:
    name: platform live (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
  # 每次推送都打一个能下载、安装、在自己机器之间试用的测试包。
  package:
    name: package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            script: scripts/package-windows.sh
          - os: macos-latest
            name: macos-universal
            script: scripts/package-macos.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Run scenarios
        run: cargo test --release -p peerdesk-e2e -- --nocapture --test-threads 2
      - name: Summary
        if: always()
        run: |
          {
            echo "## 端到端测试"
            echo
            echo "### 门槛"
            echo
            echo "| 场景 | 编码 | 门槛 | 结果 | 说明 |"
            echo "|---|---|---|---|---|"
            cat target/e2e/gates.md 2>/dev/null || true
            echo
            echo "### 各阶段指标"
            echo
            first=1
            for f in target/e2e/*/result.md; do
              if [ $first = 1 ]; then cat "$f"; first=0; else tail -n +3 "$f"; fi
            done
            echo
            echo "截图在构建产物 e2e-<提交>：每个场景一个目录，左边源画面、中间控制端看到的画面、右边差异（放大 8 倍）。"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ github.sha }}
          path: target/e2e
          retention-days: 14
      - name: Start a virtual X11 display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xterm
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 2
      - name: Live tests
        run: cargo test -p peerdesk-platform --test live -- --ignored --test-threads 1 --nocapture
      - name: screen-check (release build)
        shell: bash
        run: |
          cargo build --release -p peerdesk
          set +e
          ./target/release/peerdesk screen-check --out screen.bmp | tee check.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ] && [ "$RUNNER_OS" = "macOS" ] && grep -q "权限" check.txt; then
            echo "::notice title=macOS 没有屏幕录制权限::这台 CI 机器没有授予屏幕录制权限，无法采集画面（不算失败）"
            exit 0
          fi
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-check-${{ matrix.os }}
          path: screen.bmp
          if-no-files-found: ignore
        with:
          key: package
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build console
        shell: bash
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: web
      - name: Package
        shell: bash
        run: |
          short=$(git rev-parse --short=7 HEAD)
          echo "ARTIFACT=peerdesk-$short-${{ matrix.name }}" >> "$GITHUB_ENV"
          ${{ matrix.script }} dist "peerdesk-$short-${{ matrix.name }}"
      - name: Binary sizes
        shell: bash
        run: ls -l target/release/peerdesk* target/universal/* 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # 在虚拟显示器上打开图形界面（自测模式：开启被控并连接本机），截一张图。
  gui-screenshot:
    name: gui screenshot (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb imagemagick libgl1-mesa-dri libegl1 libxkbcommon-x11-0 fonts-noto-cjk
      - run: cargo build --release -p peerdesk
      - name: Run the GUI and take screenshots
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          export DISPLAY=:99 PEERDESK_DATA_DIR=$PWD/gui-data
          # 主窗口（只开启被控）两种语言各一张，观看窗口（连接本机）一张。
          shot() {
            PEERDESK_LANG=$1 PEERDESK_GUI_SELFTEST=$2 ./target/release/peerdesk > gui-$3.log 2>&1 &
            pid=$!
            sleep 10
            import -window root gui-$3.png
            kill $pid || true
            wait $pid || true
            cat gui-$3.log
          }
          shot zh host main-zh
          shot en host main-en
          shot zh connect viewer-zh
          ls -l gui-*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: peerdesk-gui-screenshots
          path: gui-*.png
          retention-days: 14

  # 探测各系统的 CI 机器能不能截屏：决定屏幕采集的代码能否在 CI 里测。
  # 这个任务失败不算整体失败。
  screen-probe:
    name: screen probe (${{ matrix.os }})
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Linux (virtual X11 display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb x11-apps x11-utils imagemagick xdotool
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          export DISPLAY=:99
          xdpyinfo | grep -E "dimensions|depth of root"
          xclock -geometry 400x400+100+100 &
          sleep 2
          xdotool mousemove 300 300 click 1 && echo "input injection: ok"
          import -window root screen.png
          identify screen.png
      - name: Windows (interactive desktop)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          "screen: $($b.Width)x$($b.Height)"
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("screen.png")
          "saved $((Get-Item screen.png).Length) bytes"
          Get-CimInstance Win32_VideoController | Select-Object Name, AdapterRAM, VideoProcessor | Format-List
      - name: macOS (screencapture)
        if: runner.os == 'macOS'
        run: |
          system_profiler SPDisplaysDataType | head -30
          screencapture -x screen.png
          ls -l screen.png
          sips -g pixelWidth -g pixelHeight screen.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-${{ matrix.os }}
          path: screen.png
          if-no-files-found: warn
